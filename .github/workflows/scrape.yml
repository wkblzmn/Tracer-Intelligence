name: Daily Scrape

# What runs here and what does not
#
# CI runs Bdjobs and the link checker. Both work from GitHub's runners.
#
# Skill.jobs and Shomvob are NOT here — both are blocked from datacenter IPs
# and must be run locally, on a residential connection. Skill.jobs returns a
# bare 403 on the first request from an Azure runner (confirmed 2026-07-31),
# while the identical code returns 200 and full results from a home network.
# It inserted normally from CI between 2026-07-11 and 2026-07-21, then the
# site tightened its Cloudflare settings and every run since has been blocked.
# Adding it back will only turn this workflow red again.
#
#   run these two by hand:  python -m scrapy crawl skilljobs
#                           python shomvob.py
on:
  schedule:
    - cron: '0 17 * * *'
  workflow_dispatch:
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install scrapy psycopg2-binary python-dotenv requests
      # The spider writes items to a feed file purely so the step can assert it
      # scraped something. A spider that reaches zero items — blocked IP,
      # changed endpoint, moved markup — otherwise exits 0 and CI stays green
      # while the source silently goes stale. Skilljobs did exactly that
      # between 2026-07-21 and 2026-07-27 and nothing reported it.
      - name: Run Bdjobs scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        working-directory: tracer_intelligence
        run: |
          python -m scrapy crawl bdjobs -O /tmp/bdjobs.jl
          if [ ! -s /tmp/bdjobs.jl ]; then
            echo "::error::Bdjobs scraped 0 items — source is not reaching the database"
            echo "--- what the runner actually receives ---"
            curl -s -o /dev/null -w "status=%{http_code}\n" \
              "https://api.bdjobs.com/Jobs/api/JobSearch/GetJobSearch?pg=1&rpp=1&isPro=0&ToggleJobs=true&isFresher=false" || true
            exit 1
          fi
          echo "Bdjobs items: $(wc -l < /tmp/bdjobs.jl)"
      # if: always() so a failed scrape still gets its links checked rather
      # than compounding one stale source with another.
      - name: Check for dead job links
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONUNBUFFERED: "1"
        working-directory: tracer_intelligence
        run: |
          python link_checker.py
