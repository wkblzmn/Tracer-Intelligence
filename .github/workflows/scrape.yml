name: Daily Scrape
on:
  schedule:
    - cron: '0 17 * * *'
  workflow_dispatch:
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install scrapy psycopg2-binary python-dotenv requests
      - name: Run Bdjobs scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        working-directory: tracer_intelligence
        run: |
          python -m scrapy crawl bdjobs
      - name: Run Skilljobs scraper
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        working-directory: tracer_intelligence
        run: |
          python -m scrapy crawl skilljobs
      - name: Check for dead job links
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONUNBUFFERED: "1"
        working-directory: tracer_intelligence
        run: |
          python link_checker.py